version: 2

updates:
  # اعتماديات التطبيق (npm)
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: 'deps'
    ignore:
      # الترقيات الكبرى (semver-major) تُدار يدويًا لأنها تتطلب ترحيلًا واختبارًا،
      # وتبقى تنبيهات الأمان ظاهرة في تبويب Security لمراجعتها.
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      # تحديثات الأمان تُطلق كطلب مستقل فورًا
      security:
        applies-to: security-updates
        patterns: ['*']
      dev-minor-patch:
        applies-to: version-updates
        dependency-type: development
        update-types: ['minor', 'patch']

  # إجراءات GitHub المستخدمة في سير العمل
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: 'ci'
