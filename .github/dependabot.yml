version: 2

updates:
  # اعتماديات التطبيق (npm)
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: 'deps'
    groups:
      # تحديثات الأمان تُطلق فورًا كطلب مستقل
      security:
        applies-to: security-updates
        patterns: ['*']
      dev-minor-patch:
        applies-to: version-updates
        dependency-type: development
        update-types: ['minor', 'patch']

  # إجراءات GitHub المستخدمة في سير العمل
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: 'ci'
