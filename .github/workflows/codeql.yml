name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # فحص أمني أسبوعي (الاثنين 03:00 بتوقيت UTC)
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']

    steps:
      - name: استنساخ المستودع
        uses: actions/checkout@v7

      - name: تهيئة CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: التحليل
        uses: github/codeql-action/analyze@v4
